services:
  api:
    image: epub-library:1.0.0
    environment:
      - LIBRARY_DATA_PATH=/data/epub-library
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DB_NAME=epub-lib
      - POSTGRES_USER=hp
      - POSTGRES_PW=elo
      - API_PORT=9093
      - API_ADMIN_USER=admin
      - API_ADMIN_PW=elo
    ports:
      - 9093:9093
    volumes:
      - librarydata:/data/epub-library
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=hp
      - POSTGRES_PASSWORD=elo
      - POSTGRES_DB=epub-lib
      - POSTGRES_AUTH_METHOD=trust
    volumes:
      - epubdb:/var/lib/postgresql/data
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - 8081:8080
    depends_on:
      - db

volumes:
  epubdb:
  librarydata:
