<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest Release</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #13131c;
      --border:    #1f1f30;
      --accent:    #6ee7b7;
      --accent2:   #818cf8;
      --pre:       #fb923c;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    12px;
      --mono:      'Space Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(110,231,183,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,231,183,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridShift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridShift {
      from { transform: translateY(0); }
      to   { transform: translateY(40px); }
    }

    body::after {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(129,140,248,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 0 80px rgba(110,231,183,.05), 0 20px 60px rgba(0,0,0,.5);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, rgba(110,231,183,.2), transparent 60%, rgba(129,140,248,.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .label {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .4rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }

    .badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .4rem;
      flex-shrink: 0;
    }

    .tag-badge {
      font-family: var(--mono);
      font-size: .75rem;
      background: rgba(110,231,183,.1);
      color: var(--accent);
      border: 1px solid rgba(110,231,183,.2);
      border-radius: 100px;
      padding: .3rem .8rem;
      white-space: nowrap;
    }

    .pre-badge {
      font-family: var(--mono);
      font-size: .65rem;
      background: rgba(251,146,60,.1);
      color: var(--pre);
      border: 1px solid rgba(251,146,60,.25);
      border-radius: 100px;
      padding: .2rem .65rem;
      white-space: nowrap;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 1.5rem;
    }

    .section-label {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .75rem;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
      margin-bottom: .6rem;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.02);
      color: var(--text);
      font-family: var(--sans);
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s, box-shadow .15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(110,231,183,.07);
      border-color: rgba(110,231,183,.35);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(110,231,183,.1);
    }

    .btn:active { transform: translateY(0); }

    .btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: .9rem;
    }

    .btn-icon.green  { background: rgba(110,231,183,.12); }
    .btn-icon.indigo { background: rgba(129,140,248,.12); }
    .btn-icon.amber  { background: rgba(251,191, 36,.1);  }
    .btn-icon.rose   { background: rgba(251,113,133,.1);  }

    .btn-text { display: flex; flex-direction: column; line-height: 1.2; }
    .btn-sub  { font-size: .65rem; font-weight: 400; color: var(--muted); }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      text-decoration: none;
      margin-top: 1.5rem;
      transition: color .15s;
    }
    .footer-link:hover { color: var(--accent2); }

    .error-state {
      font-family: var(--mono);
      color: #f87171;
      font-size: .85rem;
      padding: .75rem 1rem;
      background: rgba(248,113,113,.07);
      border: 1px solid rgba(248,113,113,.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">

    <div th:if="${error}" class="error-state" th:text="${error}"></div>

    <div th:unless="${error}">

      <div class="header">
        <div class="title-group">
          <div class="label">Latest Release</div>
          <h1 th:text="${releaseName}">My Library</h1>
        </div>
        <div class="badges">
          <span class="tag-badge" th:text="${tagName}">v1.0.0</span>
          <span th:if="${prerelease}" class="pre-badge">pre-release</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-label">Source Code</div>
      <div class="btn-grid" style="margin-bottom:1.25rem">
        <a th:href="${zipUrl}" class="btn" download>
          <div class="btn-icon green">📦</div>
          <div class="btn-text">
            ZIP
            <span class="btn-sub">Source Archive</span>
          </div>
        </a>
        <a th:href="${tarUrl}" class="btn" download>
          <div class="btn-icon green">🗜️</div>
          <div class="btn-text">
            TAR.GZ
            <span class="btn-sub">Source Archive</span>
          </div>
        </a>
      </div>

      <div class="section-label">Maven Artifacts</div>
      <div class="btn-grid">
        <a th:href="${jarUrl}" th:classappend="${jarUrl == null} ? ' disabled'" class="btn" download>
          <div class="btn-icon indigo">☕</div>
          <div class="btn-text">
            JAR
            <span class="btn-sub">Compiled Library</span>
          </div>
        </a>
        <a th:href="${sourcesUrl}" th:classappend="${sourcesUrl == null} ? ' disabled'" class="btn" download>
          <div class="btn-icon amber">📄</div>
          <div class="btn-text">
            Sources JAR
            <span class="btn-sub">Source Attachments</span>
          </div>
        </a>
        <a th:href="${javadocUrl}" th:classappend="${javadocUrl == null} ? ' disabled'" class="btn" download>
          <div class="btn-icon rose">📚</div>
          <div class="btn-text">
            JavaDoc JAR
            <span class="btn-sub">API Documentation</span>
          </div>
        </a>
      </div>

      <a th:href="${htmlUrl}" target="_blank" class="footer-link">
        ↗ Release auf GitHub ansehen
      </a>

    </div>
  </div>

</body>
</html>
